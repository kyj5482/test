<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터를 만들고, 선수를 키웁니다 — AI로 유스 스포츠 성장을 기록·분석하는 아빠 개발자</title>
  <meta name="description" content="AI와 데이터로 유스 스포츠(수영) 성장을 기록·분석하는 아빠 개발자. 관중석의 질문이 이야기가 되고, 그 이야기가 SwimVault·SplitLane·swim.meets의 기능이 됩니다." />
  <!-- __BUILD_VERSION__은 배포 워크플로우가 커밋 해시로 치환 (캐시 버스팅) -->
  <script>window.BUILD_VERSION = '__BUILD_VERSION__';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=__BUILD_VERSION__" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <!-- 프레지식 무한 캔버스: 모든 장면(.scene)이 절대좌표로 놓이고 카메라(transform)가 이동한다 -->
  <div id="stage">
    <div id="canvas"></div>
  </div>

  <!-- HUD: 캔버스 위에 고정되는 UI -->
  <header class="hud hud-brand" id="hud-brand" title="처음으로">
    <span class="brand-mark">〰️</span>
    <span class="brand-text">
      <strong>데이터를 만들고, 선수를 키웁니다</strong>
      <small>Engineering Data, Raising Athletes.</small>
    </span>
  </header>

  <nav class="hud hud-nav" id="hud-nav">
    <button id="nav-back" class="hud-btn" hidden>← 돌아가기</button>
  </nav>

  <!-- 우측 대시 레일: 이동한 만큼 - 가 쌓이고, 호버하면 목차가 열려 점프한다 -->
  <aside id="rail" class="hud">
    <div id="rail-dashes"></div>
    <div id="rail-panel" hidden></div>
  </aside>

  <div class="hud hud-loc" id="hud-loc"></div>
  <div class="hud hud-hint" id="hud-hint">스크롤로 다음 장면 ↓ · 클릭하면 오른쪽으로 깊이 들어갑니다 →</div>

  <script src="assets/app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
